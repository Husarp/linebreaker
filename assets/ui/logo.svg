<svg xmlns="http://www.w3.org/2000/svg" id="linebreaker-wordmark" viewBox="0 0 1124 200" role="img" aria-labelledby="wordmark-title">
  <title id="wordmark-title">LINEBREAKER</title>
  <defs>
    <linearGradient id="wordmark-face" gradientUnits="userSpaceOnUse" x2="0" y1="22" y2="178">
      <stop stop-color="#00eef4" style="stop-color:var(--logo-accent,var(--accent,var(--primary,#00eef4)))"/>
      <stop offset=".5" stop-color="#eaf7ff"/>
      <stop offset="1" stop-color="#ff34de" style="stop-color:var(--logo-secondary,var(--logo-accent,var(--accent,var(--primary,#ff34de))))"/>
    </linearGradient>
    <linearGradient id="wordmark-line" gradientUnits="userSpaceOnUse" x2="1124">
      <stop offset=".35" stop-color="#00eef4" style="stop-color:var(--logo-accent,var(--accent,var(--primary,#00eef4)))"/>
      <stop offset=".5" stop-color="#f4faff"/>
      <stop offset=".65" stop-color="#ff34de" style="stop-color:var(--logo-secondary,var(--logo-accent,var(--accent,var(--primary,#ff34de))))"/>
    </linearGradient>
    <clipPath id="wordmark-cut">
      <path d="M0 0H1124V90H644L620 87L595 92L579 83L563 92L541 86L514 90H0Z
               M0 110H514L541 113L563 107L579 117L595 108L620 113L644 110H1124V200H0Z"/>
    </clipPath>
    <g id="wordmark-glyphs" transform="matrix(1 0 -.17 1 66 22)" fill-rule="evenodd" stroke-linejoin="round">
      <path d="M0 0H28V127H76V156H0Z"/>
      <path transform="translate(90)" d="M0 0H28V156H0Z"/>
      <path transform="translate(132)" d="M0 0H27L64 88V0H92V156H65L28 68V156H0Z"/>
      <path id="wordmark-e" transform="translate(238)" d="M0 0H76V29H28V63H66V91H28V127H76V156H0Z"/>
      <path transform="translate(328)" d="M0 0H72L90 18V62L74 78L90 94V138L72 156H0Z M28 29V63H55L62 56V36L55 29Z M28 93V127H55L62 120V100L55 93Z"/>
      <path id="wordmark-r" transform="translate(432)" d="M0 0H72L90 18V75L72 93H65L92 156H61L34 93H28V156H0Z M28 29V64H55L62 57V36L55 29Z"/>
      <use href="#wordmark-e" x="300"/>
      <path transform="translate(628)" d="M29 0H63L92 156H63L57 123H35L29 156H0Z M46 54L39 97H53Z"/>
      <path transform="translate(734)" d="M0 0H28V64L61 0H92L51 77L92 156H60L28 94V156H0Z"/>
      <use href="#wordmark-e" x="602"/>
      <use href="#wordmark-r" x="498"/>
    </g>
    <path id="wordmark-cells" d="M12 100H548M602 100H1112" stroke-dasharray="16 10"/>
    <path id="wordmark-sparks" d="M553 96L562 91L569 99L561 106Z M570 96L579 87L588 96L579 105Z M589 101L596 96L601 103L594 110Z
                                 M555 77L550 68L558 70L562 78Z M590 73L595 62L600 65L594 76Z M563 115L569 121L559 130Z M587 118L596 121L599 132L590 127Z"/>
    <filter id="wordmark-bloom" x="-2%" y="-75%" width="104%" height="250%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <g clip-path="url(#wordmark-cut)">
    <use href="#wordmark-glyphs" fill="#080f20" stroke="#080f20" stroke-width="6" transform="translate(0 3)"/>
    <use href="#wordmark-glyphs" fill="url(#wordmark-face)" stroke="#effaff" stroke-opacity=".56" stroke-width="1.5"/>
  </g>
  <g filter="url(#wordmark-bloom)" opacity=".78">
    <use href="#wordmark-cells" stroke="url(#wordmark-line)" stroke-width="16"/>
    <use href="#wordmark-sparks" fill="url(#wordmark-line)"/>
  </g>
  <use href="#wordmark-cells" stroke="url(#wordmark-line)" stroke-width="16"/>
  <use href="#wordmark-cells" stroke="#fff" stroke-opacity=".58" stroke-width="3" transform="translate(0 -5)"/>
  <use href="#wordmark-sparks" fill="url(#wordmark-line)" stroke="#fff" stroke-opacity=".65"/>
</svg>
