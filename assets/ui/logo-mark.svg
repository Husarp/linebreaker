<svg xmlns="http://www.w3.org/2000/svg" id="linebreaker-mark" viewBox="0 0 128 128" role="img" aria-labelledby="mark-title">
  <title id="mark-title">Linebreaker mark</title>
  <defs>
    <linearGradient id="mark-face" gradientUnits="userSpaceOnUse" x2="0" y1="22" y2="106">
      <stop stop-color="#00eef4" style="stop-color:var(--logo-accent,var(--accent,var(--primary,#00eef4)))"/>
      <stop offset=".5" stop-color="#eaf7ff"/>
      <stop offset="1" stop-color="#ff34de" style="stop-color:var(--logo-secondary,var(--logo-accent,var(--accent,var(--primary,#ff34de))))"/>
    </linearGradient>
    <linearGradient id="mark-line" gradientUnits="userSpaceOnUse" x1="14" x2="114">
      <stop offset=".25" stop-color="#00eef4" style="stop-color:var(--logo-accent,var(--accent,var(--primary,#00eef4)))"/>
      <stop offset=".5" stop-color="#f4faff"/>
      <stop offset=".75" stop-color="#ff34de" style="stop-color:var(--logo-secondary,var(--logo-accent,var(--accent,var(--primary,#ff34de))))"/>
    </linearGradient>
    <path id="mark-cells" d="M16 64H50M78 64H112" stroke-dasharray="10 2"/>
    <path id="mark-sparks" d="M53 63L59 57L65 63L59 69Z M65 65L71 59L77 65L71 71Z M67 51L70 44L73 46L70 53Z M63 76L68 80L61 85Z"/>
    <filter id="mark-bloom" x="-15%" y="-50%" width="130%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <path d="M20 5H108L123 20V108L108 123H20L5 108V20Z" fill="#080f20" stroke="url(#mark-line)" stroke-opacity=".55" stroke-width="2"/>
  <path d="M44 22H63L57 54L38 57Z M36 73L55 70L52 86H91L87 106H30Z" fill="url(#mark-face)" stroke="#effaff" stroke-opacity=".56" stroke-linejoin="round"/>
  <g filter="url(#mark-bloom)" opacity=".78">
    <use href="#mark-cells" stroke="url(#mark-line)" stroke-width="10"/>
    <use href="#mark-sparks" fill="url(#mark-line)"/>
  </g>
  <use href="#mark-cells" stroke="url(#mark-line)" stroke-width="10"/>
  <use href="#mark-cells" stroke="#fff" stroke-opacity=".58" stroke-width="2" transform="translate(0 -3)"/>
  <use href="#mark-sparks" fill="url(#mark-line)" stroke="#fff" stroke-opacity=".65" stroke-width=".75"/>
</svg>
