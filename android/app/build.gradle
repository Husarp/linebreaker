apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def checkout = rootProject.projectDir.parentFile.canonicalFile
def configOutput = providers.exec {
    workingDir checkout
    commandLine 'node', 'scripts/ota-config.mjs', 'android'
}.standardOutput.asText.get()
def ota = new groovy.json.JsonSlurper().parseText(configOutput)
def signingInput = new Properties()
def keystore = file(ota.signing.keystore).canonicalFile
def propertiesFile = file(ota.signing.properties).canonicalFile
def external = [keystore, propertiesFile].every { !it.toPath().startsWith(checkout.toPath()) }
if (external && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') || it == 'build' }) {
    if (propertiesFile.isFile()) propertiesFile.withInputStream { signingInput.load(it) }
}
def storePass = providers.environmentVariable(ota.signing.storePasswordEnv).orNull ?: signingInput.getProperty('storePassword')
def keyPass = providers.environmentVariable(ota.signing.keyPasswordEnv).orNull ?: signingInput.getProperty('keyPassword')
def signed = external && keystore.isFile() && storePass && keyPass

android {
    namespace = "com.husarp.linebreaker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId ota.appId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ota.build.versionCode as int
        versionName ota.build.versionName
        resValue 'string', 'app_name', ota.appName
        buildConfigField 'String', 'OTA_BUNDLE_URL', groovy.json.JsonOutput.toJson(ota.urls.bundle)
        buildConfigField 'String', 'OTA_SHELL_URL', groovy.json.JsonOutput.toJson(ota.urls.shell)
        buildConfigField 'String', 'OTA_RELEASES_URL', groovy.json.JsonOutput.toJson(ota.urls.releases)
        buildConfigField 'int', 'SHELL_API', "${ota.build.shellApi}"
        buildConfigField 'long', 'SHELL_RELEASED_AT', "${Long.parseLong(findProperty('shellReleasedAt') ?: '0')}L"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            if (signed) {
                storeFile keystore
                storePassword storePass
                keyAlias ota.signing.keyAlias
                keyPassword keyPass
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}
kotlin { jvmToolchain(21) }

def verifyReleaseConfig = tasks.register('verifyReleaseConfig') {
    doLast {
        if (!signed) throw new GradleException('Configure the existing external Linebreaker release keys (docs/ANDROID.md).')
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn verifyReleaseConfig }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation project(':core')
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
